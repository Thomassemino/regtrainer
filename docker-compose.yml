services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      smtp:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "3000:3000"

  migrate:
    build:
      context: .
      target: builder
    restart: "no"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: beto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: beto_training
    volumes:
      - beto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beto -d beto_training"]
      interval: 10s
      timeout: 5s
      retries: 5

  smtp:
    image: boky/postfix
    restart: unless-stopped
    environment:
      ALLOWED_SENDER_DOMAINS: "betotraining.com.ar"

volumes:
  beto_pgdata: